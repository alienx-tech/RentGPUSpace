services:
  app:
    # The same published image the Coolify deployment runs, so `docker compose
    # up` here exercises the artifact that ships rather than a local rebuild.
    # Override the tag with APP_IMAGE_TAG to try a specific build.
    image: registry.digitalocean.com/chaimindregistry/rentgpu-space:${APP_IMAGE_TAG:-latest}
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      - "${APP_PORT:-3000}:3000"
    init: true
    healthcheck:
      test:
        ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 30s
    restart: unless-stopped
